name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    name: Deploy GitHub Pages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Deploy: ${{ github.sha }}"

  tauri:
    name: Build Windows exe + Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run tauri build

      - name: Rename portable exe
        run: Copy-Item src-tauri/target/release/app.exe labobine-portable.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: La Bobine — build ${{ github.sha }}
          prerelease: true
          files: |
            labobine-portable.exe
            src-tauri/target/release/bundle/nsis/labobine_*_setup.exe
            src-tauri/target/release/bundle/msi/labobine_*_x64_en-US.msi
